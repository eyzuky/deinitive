name: LeakLab
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LeakLab:
    type: application
    platform: iOS
    sources:
      - path: LeakLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deinitive.LeakLab
        PRODUCT_NAME: LeakLab
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: LeakLab/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
